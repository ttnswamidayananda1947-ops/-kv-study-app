<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>கல்வி வானம் - மாணவர் பக்கம்</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f0f4f8; color: #333; }

        /* Menu Bar / Navbar */
        .navbar { background: linear-gradient(135deg, #4a90e2 0%, #007aff 100%); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .nav-links { list-style: none; display: flex; gap: 15px; }
        .nav-links li a { color: white; text-decoration: none; font-weight: 500; padding: 5px 10px; border-radius: 5px; transition: 0.3s; }
        .nav-links li a:hover { background: rgba(255,255,255,0.2); }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Subject Tabs */
        .subject-menu { display: flex; justify-content: center; gap: 15px; margin: 20px; flex-wrap: wrap; }
        .subject-btn { background: white; border: 2px solid #4a90e2; color: #4a90e2; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.3s; }
        .subject-btn:hover, .subject-btn.active { background: #4a90e2; color: white; }

        /* Content Area */
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px 40px 20px; }
        .lesson-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .lesson-title { color: #2c3e50; margin-bottom: 15px; font-size: 1.4rem; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* YouTube Video Container */
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; /* 16:9 Aspect Ratio */ margin-bottom: 20px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 10px; border: none; }

        /* Q&A Section */
        .qa-section { background: #f9fbff; padding: 15px; border-radius: 10px; border-left: 4px solid #4a90e2; margin-top: 15px; }
        .q-text { font-weight: bold; color: #d35400; margin-bottom: 5px; margin-top: 10px; }
        .a-text { color: #34495e; margin-bottom: 10px; padding-left: 10px; }
        
        .empty-msg { text-align: center; color: #7f8c8d; font-size: 1.2rem; margin-top: 50px; }
        .loading-msg { text-align: center; color: #4a90e2; font-size: 1.2rem; font-weight: bold; margin-top: 50px; }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .navbar { flex-direction: column; gap: 15px; text-align: center; }
            .nav-links { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- Menu Bar -->
    <nav class="navbar">
        <div class="logo">☁️ கல்வி வானம்</div>
        <ul class="nav-links">
            <li><a href="index.html">முகப்பு (Home)</a></li>
            <li><a href="about.html">எங்களை பற்றி (About)</a></li>
            <li><a href="contact.html">தொடர்புக்கு (Contact)</a></li>
            <li><a href="disclaimer.html">பொறுப்புத்துறப்பு (Disclaimer)</a></li>
        </ul>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </nav>

    <!-- Subject Selection Buttons -->
    <div class="subject-menu">
        <button class="subject-btn active" id="btn-Maths" onclick="loadLessons('Maths')">📐 கணிதம்</button>
        <button class="subject-btn" id="btn-Electronics" onclick="loadLessons('Electronics')">🔌 மின்னணுவியல்</button>
        <button class="subject-btn" id="btn-Chemistry" onclick="loadLessons('Chemistry')">🧪 வேதியியல்</button>
    </div>

    <!-- Data Display Container -->
    <div class="container" id="lessons-container">
        <p class="loading-msg">பாடங்கள் ஏற்றப்படுகின்றன... ⏳</p>
    </div>

    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBAvBOy2nPztuB3lca6uzfx6cXLUKcvVsI",
            authDomain: "kv-study-app.firebaseapp.com",
            projectId: "kv-study-app",
            storageBucket: "kv-study-app.firebasestorage.app",
            messagingSenderId: "865978831958",
            appId: "1:865978831958:web:7d2a2f8f1200daa64c57f7"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. செக்யூரிட்டி: லாகின் செய்துள்ளாரா என சோதித்தல்
        auth.onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                // லாகின் ஆகியிருந்தால், முதல் பாடத்தை (Maths) லோட் செய்யவும்
                loadLessons('Maths');
            }
        });

        // 3. YouTube லிங்க்கை Embed லிங்க்காக மாற்றும் ஃபங்ஷன்
        function getYouTubeEmbedUrl(url) {
            let videoId = "";
            if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
            } else if (url.includes("watch?v=")) {
                videoId = url.split("watch?v=")[1].split("&")[0];
            }
            return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
        }

        // 4. டேட்டாபேஸிலிருந்து பாடங்களை எடுக்கும் ஃபங்ஷன்
        async function loadLessons(subject) {
            // பட்டன் நிறங்களை மாற்றுதல்
            document.querySelectorAll('.subject-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${subject}`).classList.add('active');

            const container = document.getElementById('lessons-container');
            container.innerHTML = `<p class="loading-msg">தகவல்கள் ஏற்றப்படுகின்றன... ⏳</p>`;

            try {
                // Firebase Database-ல் இருந்து குறிப்பிட்ட பாடத்தை மட்டும் எடுத்தல்
                const snapshot = await db.collection("lessons")
                                         .where("subject", "==", subject)
                                         .get();
                
                container.innerHTML = ""; // பழைய தகவல்களை அழித்தல்

                if (snapshot.empty) {
                    container.innerHTML = `<p class="empty-msg">இந்த பாடத்தில் இன்னும் வீடியோக்கள் பதிவேற்றப்படவில்லை. 📚</p>`;
                    return;
                }

                // டேட்டாவை HTML ஆக மாற்றுதல்
                snapshot.forEach(doc => {
                    const lesson = doc.data();
                    const embedUrl = getYouTubeEmbedUrl(lesson.videoUrl);
                    
                    let qaHTML = "";
                    // கேள்விகள் இருந்தால் அதை HTML ஆக மாற்றுதல்
                    if (lesson.qa && lesson.qa.length > 0) {
                        lesson.qa.forEach((item, index) => {
                            if (item.q.trim() !== "") { // கேள்வி காலியாக இல்லையென்றால் மட்டும்
                                qaHTML += `
                                    <div class="q-text">Q${index + 1}: ${item.q}</div>
                                    <div class="a-text">A: ${item.a}</div>
                                `;
                            }
                        });
                    }

                    // முழு கார்டு HTML
                    const cardHTML = `
                        <div class="lesson-card">
                            <h2 class="lesson-title">${lesson.title}</h2>
                            <div class="video-container">
                                <iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                            </div>
                            ${qaHTML !== "" ? `<div class="qa-section"><h3>கேள்வி - பதில்கள்:</h3>${qaHTML}</div>` : ""}
                        </div>
                    `;
                    container.innerHTML += cardHTML;
                });

            } catch (error) {
                console.error("Error loading lessons:", error);
                container.innerHTML = `<p class="empty-msg" style="color:red;">தகவல்களை எடுப்பதில் பிழை ஏற்பட்டது.</p>`;
            }
        }

        // 5. Logout
        function handleLogout() {
            auth.signOut().then(() => {
                localStorage.removeItem("isLoggedIn");
                window.location.href = "login.html";
            });
        }
    </script>
</body>
</html>
