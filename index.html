<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>கல்வி வானம் - Smart Study App</title>
    
    <!-- லாகின் செக் (Auth Check) - லாகின் செய்யாதவர்களை வெளியேற்ற -->
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html"; // லாகின் பேஜிற்குத் துரத்துதல்
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f4f7f6; color: #333; overflow-x: hidden; }

        /* ஸ்கிரீன் அனிமேஷன் */
        .screen { width: 100%; min-height: calc(100vh - 70px); animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Navigation Menu Bar (புதியது) --- */
        .navbar { background: #4a90e2; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .nav-brand { color: white; font-size: 1.5rem; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { color: white; text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: 0.3s; padding: 5px 10px; border-radius: 5px; }
        .nav-links a:hover { background: rgba(255,255,255,0.2); }
        .active-link { background: rgba(255,255,255,0.2); font-weight: bold; }

        .logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 5px rgba(231,76,60,0.4); }
        .logout-btn:hover { background: #c0392b; transform: scale(0.95); }

        /* --- Home Screen (Cards) --- */
        .welcome-banner { text-align: center; padding: 20px; margin-top: 10px; }
        .welcome-banner h1 { color: #2c3e50; }
        .welcome-banner p { color: #7f8c8d; margin-top: 5px; }

        main { padding: 0 20px 20px 20px; max-width: 800px; margin: 0 auto; padding-bottom: 80px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-top: 15px; }
        .subject-card { background: white; padding: 30px 15px; border-radius: 15px; text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; border: 2px solid transparent; }
        .subject-card:hover { border-color: #4a90e2; transform: translateY(-5px); }
        .subject-card:active { transform: scale(0.95); }
        .card-icon { font-size: 3.5rem; margin-bottom: 10px; }
        .subject-card h3 { color: #2c3e50; }

        /* --- Details Screen --- */
        .details-header { display: flex; align-items: center; justify-content: space-between; text-align: left; background: white; color: #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-top: 20px; }
        .back-btn { background: #f0f0f0; border: none; color: #333; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .back-btn:hover { background: #e0e0e0; }
        .video-container, .qa-container { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 8px; overflow: hidden; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .qa-container h3 { color: #2c3e50; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .qa-item { border-bottom: 1px solid #eee; padding: 12px 0; }
        .qa-question { font-weight: bold; color: #e67e22; cursor: pointer; display: flex; justify-content: space-between; }
        .qa-answer { display: none; margin-top: 10px; color: #555; background: #fdfbf7; padding: 12px; border-left: 4px solid #e67e22; border-radius: 6px; line-height: 1.5; }

        /* --- Floating Action Button (KV AI) --- */
        .floating-ai-btn { position: fixed; bottom: 25px; right: 25px; background: linear-gradient(135deg, #2c3e50, #4ca1af); color: white; border: none; border-radius: 30px; padding: 12px 25px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 8px; z-index: 100; transition: 0.3s; }
        .floating-ai-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .floating-ai-btn:active { transform: scale(0.95); }

        /* மொபைல் டிசைனுக்காக (Responsive) */
        @media (max-width: 600px) {
            .nav-links { display: none; } /* மொபைலில் மெனு லிங்க்களை மறைக்க (பிற்காலத்தில் Hamburger menu வைக்கலாம்) */
            .logout-btn { display: block; }
        }
    </style>
</head>
<body>

    <!-- மெனு பார் (Navigation Bar) -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">📚 கல்வி வானம்</a>
        
        <div class="nav-links">
            <a href="index.html" class="active-link">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="disclaimer.html">Disclaimer</a>
        </div>

        <!-- வெளியேறு (Logout) பட்டன் -->
        <button class="logout-btn" onclick="handleLogout()">Sign out</button>
    </nav>
        
    <!-- 1. Home Screen (Subject Cards) -->
    <div id="home-section" class="screen">
        <div class="welcome-banner">
            <h1>எதைப் படிக்க விரும்புகிறீர்கள்?</h1>
            <p>உங்களுக்குப் பிடித்த பாடத்தைத் தேர்ந்தெடுத்துப் படிக்கத் தொடங்குங்கள்</p>
        </div>
        <main>
            <div class="cards-grid">
                <div class="subject-card" onclick="openSubject('maths')">
                    <div class="card-icon">📐</div>
                    <h3>கணிதம்</h3>
                </div>
                <div class="subject-card" onclick="openSubject('electronics')">
                    <div class="card-icon">⚡</div>
                    <h3>எலக்ட்ரானிக்ஸ்</h3>
                </div>
                <div class="subject-card" onclick="openSubject('chemistry')">
                    <div class="card-icon">🧪</div>
                    <h3>வேதியியல்</h3>
                </div>
            </div>
        </main>
    </div>

    <!-- 2. Subject Details Screen -->
    <div id="subject-details-section" class="screen" style="display: none;">
        <main style="padding-top: 0;">
            <header class="details-header">
                <button class="back-btn" onclick="goToHome()">🔙 முகப்புக்குத் திரும்பு</button>
                <h2 id="subject-title">பாடம்</h2>
            </header>
            
            <section class="video-container">
                <div class="video-wrapper">
                    <!-- யூடியூப் வீடியோ வரும் இடம் -->
                    <iframe id="video-frame" src="" frameborder="0" allowfullscreen></iframe>
                </div>
            </section>
            
            <section class="qa-container">
                <h3>📝 முக்கிய கேள்வி - பதில்கள்</h3>
                <div id="qa-list"></div>
            </section>
        </main>
    </div>

    <!-- Floating Action Button (KV AI) - Redirects to kvai.html -->
    <button class="floating-ai-btn" id="fab-btn" onclick="window.location.href='kvai.html'">
        <span class="fab-icon">🤖</span>
        <span class="fab-text">KV AI</span>
    </button>

    <!-- JavaScript லாஜிக் -->
    <script>
        // --- 1. Sign Out லாஜிக் ---
        function handleLogout() {
            // லாகின் தகவலை அழித்துவிட்டு login.html-க்கு அனுப்புதல்
            localStorage.removeItem("isLoggedIn");
            window.location.href = "login.html";
        }

        // --- 2. பாடங்கள் டேட்டா (Subject Data) ---
        const contentData = {
            maths: { 
                title: "கணிதம்", 
                video: "https://www.youtube.com/embed/t-C-Q4p0aKs", 
                qa: [{ q: "இயற்கணிதம் என்றால் என்ன?", a: "எண்கள் மற்றும் எழுத்துக்களைப் பயன்படுத்தி கணிதச் சமன்பாடுகளைத் தீர்க்கும் முறையாகும்." }] 
            },
            electronics: { 
                title: "எலக்ட்ரானிக்ஸ்", 
                video: "https://www.youtube.com/embed/zqwNXY-YvO0", 
                qa: [{ q: "மின்னழுத்தம் என்றால் என்ன?", a: "மின்னோட்டத்தை உந்தித்தள்ளும் விசையே மின்னழுத்தம் எனப்படும்." }] 
            },
            chemistry: { 
                title: "வேதியியல்", 
                video: "https://www.youtube.com/embed/Vi91qyjuknM", 
                qa: [{ q: "தண்ணீரின் வேதியியல் வாய்ப்பாடு என்ன?", a: "H2O (இரண்டு ஹைட்ரஜன், ஒரு ஆக்ஸிஜன்)." }] 
            }
        };

        // --- 3. நேவிகேஷன் லாஜிக் (Navigation Logic) ---
        function openSubject(subjectKey) {
            document.getElementById('home-section').style.display = 'none';
            document.getElementById('subject-details-section').style.display = 'block';
            document.getElementById('fab-btn').style.display = 'none'; // வீடியோ பார்க்கும்போது AI பட்டனை மறைக்க

            const data = contentData[subjectKey];
            document.getElementById('subject-title').innerText = data.title;
            document.getElementById('video-frame').src = data.video;

            const qaList = document.getElementById('qa-list');
            qaList.innerHTML = ''; 
            data.qa.forEach(item => {
                qaList.innerHTML += `
                <div class="qa-item">
                    <div class="qa-question" onclick="toggleAnswer(this)">
                        <span>❓ ${item.q}</span> <span>▼</span>
                    </div>
                    <div class="qa-answer">👉 ${item.a}</div>
                </div>`;
            });
        }

        function goToHome() {
            document.getElementById('subject-details-section').style.display = 'none';
            document.getElementById('home-section').style.display = 'block';
            document.getElementById('video-frame').src = ""; // வீடியோவை நிறுத்துதல்
            document.getElementById('fab-btn').style.display = 'flex'; // முகப்பு வந்ததும் AI பட்டனை மீண்டும் காட்ட
        }

        function toggleAnswer(element) {
            const answer = element.nextElementSibling;
            answer.style.display = answer.style.display === "block" ? "none" : "block";
        }
    </script>
</body>
</html>
