<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ஆசிரியர் பக்கம் - கல்வி வானம்</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f4f7f6; }
        .navbar { background: #4a90e2; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 20px; max-width: 800px; margin: 0 auto; }
        .subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .subject-card { background: white; padding: 20px; text-align: center; border-radius: 12px; font-weight: bold; font-size: 1.2rem; color: #333; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; }
        .subject-card:hover { transform: translateY(-5px); background: #e0f7fa; }
        #upload-section { display: none; background: white; padding: 25px; border-radius: 15px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
        .qa-box { background: #f9f9f9; padding: 15px; border-left: 4px solid #4a90e2; margin-bottom: 15px; border-radius: 5px; }
        .submit-btn { width: 100%; padding: 12px; background: #2ecc71; color: white; font-weight: bold; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
        .back-btn { background: #7f8c8d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2>ஆசிரியர் பக்கம்</h2>
        <button onclick="handleLogout()" style="background: #e74c3c; color: white; border:none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Logout</button>
    </nav>

    <div class="container">
        <div id="subject-selection">
            <h3>எந்தப் பாடத்தில் வீடியோ சேர்க்க விரும்புகிறீர்கள்?</h3>
            <div class="subject-grid">
                <div class="subject-card" onclick="openForm('Maths')">📐 Maths (கணிதம்)</div>
                <div class="subject-card" onclick="openForm('Electronics')">🔌 Electronics (மின்னணுவியல்)</div>
                <div class="subject-card" onclick="openForm('Chemistry')">🧪 Chemistry (வேதியியல்)</div>
            </div>
        </div>

        <div id="upload-section">
            <button class="back-btn" onclick="closeForm()">🔙 பின்செல்ல</button>
            <h3 id="form-title" style="margin-bottom: 15px; color: #4a90e2;"></h3>
            
            <div class="form-group">
                <label>பாடத்தின் தலைப்பு (Lesson Title)</label>
                <input type="text" id="lessonTitle" placeholder="உதா: Algebra Basics" required>
            </div>
            
            <div class="form-group">
                <label>YouTube வீடியோ லிங்க்</label>
                <input type="url" id="videoUrl" placeholder="https://youtube.com/..." required>
            </div>

            <h4>கேள்வி - பதில்கள்</h4><br>
            
            <div class="qa-box">
                <label>கேள்வி 1</label>
                <input type="text" id="q1" placeholder="கேள்வியை உள்ளிடவும்..." style="margin-bottom:10px;">
                <label>பதில் 1</label>
                <textarea id="a1" rows="2" placeholder="பதிலை உள்ளிடவும்..."></textarea>
            </div>

            <div class="qa-box">
                <label>கேள்வி 2</label>
                <input type="text" id="q2" placeholder="கேள்வியை உள்ளிடவும்..." style="margin-bottom:10px;">
                <label>பதில் 2</label>
                <textarea id="a2" rows="2" placeholder="பதிலை உள்ளிடவும்..."></textarea>
            </div>

            <div class="qa-box">
                <label>கேள்வி 3</label>
                <input type="text" id="q3" placeholder="கேள்வியை உள்ளிடவும்..." style="margin-bottom:10px;">
                <label>பதில் 3</label>
                <textarea id="a3" rows="2" placeholder="பதிலை உள்ளிடவும்..."></textarea>
            </div>

            <button class="submit-btn" onclick="submitLesson()">💾 பதிவேற்று (Submit)</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBAvBOy2nPztuB3lca6uzfx6cXLUKcvVsI",
            authDomain: "kv-study-app.firebaseapp.com",
            projectId: "kv-study-app",
            storageBucket: "kv-study-app.firebasestorage.app",
            messagingSenderId: "865978831958",
            appId: "1:865978831958:web:7d2a2f8f1200daa64c57f7"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentSubject = "";
        let teacherEmail = "";

        auth.onAuthStateChanged((user) => {
            if (!user) window.location.href = "login.html";
            else teacherEmail = user.email;
        });

        function openForm(subject) {
            currentSubject = subject;
            document.getElementById('subject-selection').style.display = 'none';
            document.getElementById('upload-section').style.display = 'block';
            document.getElementById('form-title').innerText = subject + " - புதிய பாடம்";
        }

        function closeForm() {
            document.getElementById('subject-selection').style.display = 'block';
            document.getElementById('upload-section').style.display = 'none';
            clearForm();
        }

        async function submitLesson() {
            const title = document.getElementById('lessonTitle').value;
            const videoUrl = document.getElementById('videoUrl').value;
            
            if(!title || !videoUrl) return alert("தயவுசெய்து தலைப்பு மற்றும் வீடியோ லிங்க்கை உள்ளிடவும்!");

            const lessonData = {
                title: title,
                videoUrl: videoUrl,
                qa: [
                    { q: document.getElementById('q1').value, a: document.getElementById('a1').value },
                    { q: document.getElementById('q2').value, a: document.getElementById('a2').value },
                    { q: document.getElementById('q3').value, a: document.getElementById('a3').value }
                ],
                authorEmail: teacherEmail,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // நீங்கள் சொன்ன படி புதிய ஸ்ட்ரக்ச்சர்: subjects -> Maths -> lessons -> [data]
                await db.collection("subjects").doc(currentSubject).collection("lessons").add(lessonData);
                alert("பாடம் வெற்றிகரமாக பதிவேற்றப்பட்டது! 🎉");
                closeForm();
            } catch (error) {
                alert("பிழை ஏற்பட்டது: " + error.message);
            }
        }

        function clearForm() {
            document.getElementById('lessonTitle').value = "";
            document.getElementById('videoUrl').value = "";
            document.getElementById('q1').value = ""; document.getElementById('a1').value = "";
            document.getElementById('q2').value = ""; document.getElementById('a2').value = "";
            document.getElementById('q3').value = ""; document.getElementById('a3').value = "";
        }

        function handleLogout() {
            auth.signOut();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
