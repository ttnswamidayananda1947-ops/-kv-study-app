<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>உள்நுழைய - கல்வி வானம்</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .login-card { background: white; width: 100%; max-width: 400px; padding: 30px 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .login-card h2 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 5px; }
        .login-card p { color: #7f8c8d; font-size: 1rem; margin-bottom: 25px; transition: 0.3s; }

        .toggle-box { display: flex; background: #f0f2f5; border-radius: 30px; margin-bottom: 25px; overflow: hidden; }
        .toggle-btn { flex: 1; padding: 12px; font-weight: bold; font-size: 1rem; color: #7f8c8d; cursor: pointer; transition: 0.3s; }
        .toggle-btn.active { background: #4a90e2; color: white; border-radius: 30px; }

        .input-field { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; outline: none; transition: 0.3s; background: #f9f9f9; }
        .input-field:focus { border-color: #4a90e2; background: white; box-shadow: 0 0 5px rgba(74, 144, 226, 0.2); }

        .error-msg { color: #e74c3c; font-size: 0.9rem; margin-bottom: 15px; display: none; font-weight: bold; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-login { flex: 1; background: #4a90e2; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-signup { flex: 1; background: white; color: #4a90e2; border: 2px solid #4a90e2; padding: 14px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        .btn-login:hover { background: #357abd; }
        .btn-signup:hover { background: #f0f8ff; }
        .btn-login:disabled, .btn-signup:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>கல்வி வானம் 👋</h2>
        <p id="role-title">மாணவர் கணக்கில் நுழையவும்</p>

        <!-- Toggle Buttons (Working) -->
        <div class="toggle-box">
            <div class="toggle-btn active" id="btn-student" onclick="switchTab('student')">மாணவர்</div>
            <div class="toggle-btn" id="btn-teacher" onclick="switchTab('teacher')">ஆசிரியர்</div>
        </div>

        <div id="error-message" class="error-msg"></div>

        <input type="email" id="email" class="input-field" placeholder="மின்னஞ்சல் (Email)" required>
        <input type="password" id="password" class="input-field" placeholder="கடவுச்சொல் (Password)" required>

        <div class="btn-group">
            <button class="btn-login" id="loginBtn" onclick="loginWithEmail()">உள்நுழைய</button>
            <button class="btn-signup" id="signupBtn" onclick="signUpWithEmail()">புதிய கணக்கு</button>
        </div>
    </div>

    <script>
        // Tab மாற்றுவதற்கான பங்க்ஷன் (Toggle Logic)
        let currentRole = "student"; // Default
        
        function switchTab(role) {
            currentRole = role;
            const btnStudent = document.getElementById("btn-student");
            const btnTeacher = document.getElementById("btn-teacher");
            const roleTitle = document.getElementById("role-title");

            if (role === "student") {
                btnStudent.classList.add("active");
                btnTeacher.classList.remove("active");
                roleTitle.innerText = "மாணவர் கணக்கில் நுழையவும்";
            } else {
                btnTeacher.classList.add("active");
                btnStudent.classList.remove("active");
                roleTitle.innerText = "ஆசிரியர் கணக்கில் நுழையவும்";
            }
        }

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBAvBOy2nPztuB3lca6uzfx6cXLUKcvVsI",
            authDomain: "kv-study-app.firebaseapp.com",
            projectId: "kv-study-app",
            storageBucket: "kv-study-app.firebasestorage.app",
            messagingSenderId: "865978831958",
            appId: "1:865978831958:web:7d2a2f8f1200daa64c57f7"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ஏற்கெனவே லாகின் செய்திருந்தால் நேராக முகப்புப் பக்கத்திற்குச் செல்ல
        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById("error-message");
            errorDiv.style.display = "block";
            errorDiv.innerText = message;
        }

        // உள்நுழைய (Login)
        function loginWithEmail() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            
            if (!email || !password) {
                showError("தயவுசெய்து மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடவும்.");
                return;
            }

            document.getElementById("loginBtn").innerText = "காத்திருக்கவும்...";
            document.getElementById("loginBtn").disabled = true;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // தற்போதைக்கு மாணவர்/ஆசிரியர் இருவருக்கும் ஒரே முகப்புப் பக்கம் (index.html)
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    document.getElementById("loginBtn").innerText = "உள்நுழைய";
                    document.getElementById("loginBtn").disabled = false;
                    
                    if (error.code === 'auth/user-not-found') {
                        showError("இந்த மின்னஞ்சலில் கணக்கு இல்லை. 'புதிய கணக்கு' உருவாக்கவும்.");
                    } else if (error.code === 'auth/wrong-password') {
                        showError("கடவுச்சொல் தவறு! மீண்டும் முயற்சிக்கவும்.");
                    } else if (error.code === 'auth/invalid-email') {
                        showError("சரியான மின்னஞ்சல் முகவரியை உள்ளிடவும்.");
                    } else {
                        showError("பிழை: " + error.message);
                    }
                });
        }

        // புதிய கணக்கு உருவாக்க (Sign Up)
        function signUpWithEmail() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            
            if (!email || !password) {
                showError("தயவுசெய்து மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடவும்.");
                return;
            }
            if (password.length < 6) {
                showError("கடவுச்சொல் குறைந்தது 6 எழுத்துகள் இருக்க வேண்டும்.");
                return;
            }

            document.getElementById("signupBtn").innerText = "உருவாக்குகிறது...";
            document.getElementById("signupBtn").disabled = true;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    document.getElementById("signupBtn").innerText = "புதிய கணக்கு";
                    document.getElementById("signupBtn").disabled = false;
                    
                    if (error.code === 'auth/email-already-in-use') {
                        showError("இந்த மின்னஞ்சல் ஏற்கனவே பயன்பாட்டில் உள்ளது. 'உள்நுழைய' பட்டனை அழுத்தவும்.");
                    } else {
                        showError("பிழை: " + error.message);
                    }
                });
        }
    </script>
</body>
</html>
