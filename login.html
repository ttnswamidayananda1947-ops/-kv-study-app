<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>கல்வி வானம் - லாகின்</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f4f7f6; color: #333; overflow-x: hidden; }
        .screen { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%); }
        .login-box { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .toggle-container { display: flex; background: #f0f0f0; border-radius: 30px; margin: 20px 0; }
        .toggle-btn { flex: 1; padding: 10px; border: none; background: transparent; cursor: pointer; border-radius: 30px; color: #777; font-weight: bold; }
        .toggle-btn.active { background: #4a90e2; color: white; }
        .input-group input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .submit-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; background: #4a90e2; color: white; font-weight: bold; cursor: pointer; }
        .register-btn { flex: 1; padding: 12px; border: 1px solid #4a90e2; border-radius: 10px; background: white; color: #4a90e2; font-weight: bold; cursor: pointer; }
        .google-btn { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; background: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    </style>
</head>
<body>
    <div class="screen">
        <div class="login-box">
            <h2>கல்வி வானம் 👋</h2>
            <p id="role-desc">மாணவர் கணக்கில் நுழையவும்</p>
            
            <div class="toggle-container">
                <button class="toggle-btn active" id="btn-student" onclick="setRole('student')">மாணவர்</button>
                <button class="toggle-btn" id="btn-teacher" onclick="setRole('teacher')">ஆசிரியர்</button>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="மின்னஞ்சல் (Email)">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="கடவுச்சொல் (Password)">
            </div>
            
            <div class="btn-group">
                <button class="submit-btn" onclick="handleEmailLogin()">உள்நுழைய</button>
                <button class="register-btn" onclick="handleEmailSignUp()">புதிய கணக்கு</button>
            </div>

            <button class="google-btn" onclick="handleGoogleLogin()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" style="width:20px;" alt="Google">
                Google மூலம் தொடரவும்
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBAvBOy2nPztuB3lca6uzfx6cXLUKcvVsI",
            authDomain: "kv-study-app.firebaseapp.com",
            projectId: "kv-study-app",
            storageBucket: "kv-study-app.firebasestorage.app",
            messagingSenderId: "865978831958",
            appId: "1:865978831958:web:7d2a2f8f1200daa64c57f7"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const ADMIN_EMAIL = "ttnswamidayananda1947@gmail.com";
        let currentRole = 'student';

        function setRole(role) {
            currentRole = role;
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(role === 'student' ? 'btn-student' : 'btn-teacher').classList.add('active');
            document.getElementById('role-desc').innerText = role === 'student' ? "மாணவர் கணக்கில் நுழையவும்" : "ஆசிரியர் கணக்கில் நுழையவும்";
        }

        async function checkAndRouteUser(user) {
            if (user.email === ADMIN_EMAIL) {
                window.location.href = "admin.html";
                return;
            }

            const userDocRef = db.collection("users").doc(user.uid);
            const doc = await userDocRef.get();

            if (!doc.exists) {
                const status = (currentRole === 'student') ? "approved" : "pending";
                await userDocRef.set({ email: user.email, role: currentRole, status: status });

                if (status === "pending") {
                    auth.signOut();
                    alert("கோரிக்கை பெறப்பட்டது! அட்மின் ஒப்புதலுக்கு காத்திருக்கவும்.");
                } else {
                    window.location.href = "index.html"; // மாணவர்கள்
                }
            } else {
                const userData = doc.data();
                if (userData.role === 'teacher') {
                    if (userData.status === 'pending') {
                        auth.signOut();
                        alert("உங்கள் கணக்கு இன்னும் சரிபார்க்கப்படுகிறது. காத்திருக்கவும்.");
                    } else {
                        window.location.href = "teacher.html"; // ஆசிரியர்கள்
                    }
                } else {
                    window.location.href = "index.html"; // மாணவர்கள்
                }
            }
        }

        function handleEmailLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("Google மூலம் கணக்கு இருந்தால், கீழே உள்ள Google பட்டனை அழுத்தவும்.");
            
            auth.signInWithEmailAndPassword(email, password)
                .then(res => checkAndRouteUser(res.user))
                .catch(err => alert("தவறான பாஸ்வேர்ட் அல்லது Google கணக்கைப் பயன்படுத்தவும்."));
        }

        function handleEmailSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(email, password)
                .then(res => checkAndRouteUser(res.user))
                .catch(err => alert(err.message));
        }

        function handleGoogleLogin() {
            auth.signInWithPopup(googleProvider).then(res => checkAndRouteUser(res.user));
        }
    </script>
</body>
</html>
